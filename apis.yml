aid: platzi
name: Platzi
description: >-
  Platzi is the leading online learning platform in Latin America, offering
  thousands of technology, business, and marketing courses. For developers,
  Platzi (via PlatziLabs) publishes the free, public "Platzi Fake Store API" —
  a fully functional REST and GraphQL backend that provides mock e-commerce data
  (products, categories, users) with complete CRUD operations, JWT
  authentication, pagination, filtering, file upload, and AI-generated product
  imagery. It is a zero-signup prototyping API used worldwide to learn and
  practice building shopping and front-end applications, backed by an open
  source NestJS project.
