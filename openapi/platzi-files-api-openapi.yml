openapi: 3.0.0
info:
  title: Platzi Fake Store auth files API
  description: ''
  version: '1.0'
  contact: {}
servers: []
tags:
- name: files
paths:
  /api/v1/files/upload:
    post:
      operationId: FilesController_uploadFile
      parameters: []
      responses:
        '201':
