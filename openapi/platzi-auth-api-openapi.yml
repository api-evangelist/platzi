openapi: 3.2.0
info:
  title: Platzi Fake Store Auth API
  description: ''
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Auth
paths:
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - Auth
      summary: Auth controller login
      x-summary-source: derived
  /api/v1/auth/profile:
    get:
      operationId: AuthController_profile
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - Auth
      summary: Auth controller profile
      x-summary-source: derived
  /api/v1/auth/refresh-token:
    post:
      operationId: AuthController_refreshToken
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '201':
          description: ''
      tags:
      - Auth
      summary: Auth controller refresh token
      x-summary-source: derived
components:
  schemas:
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
